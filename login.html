<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bureau Website</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <!--Fonts & Links-->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat&family=Playfair+Display:ital@0;1&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,700&family=Playfair+Display:ital,wght@1,900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Playfair+Display:ital,wght@1,900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500&family=Playfair+Display:ital,wght@1,900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500&family=Playfair+Display:ital,wght@0,900;1,900&family=Puppies+Play&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500&family=Playfair+Display:ital,wght@0,900;1,900&family=Puppies+Play&family=Tangerine:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Cookie&family=Great+Vibes&family=Montserrat:wght@500&family=Playfair+Display:ital,wght@0,900;1,900&family=Puppies+Play&family=Tangerine:wght@400;700&display=swap');
    </style>
</head>

<body style="font-family: Montserrat, sans-serif;">
    <!--LOGIN PAGE/ REGISTER PAGE-->
    <div>
        <img src="images/WhatsApp Image 2026-09-09 newimagehero.png" class="login-bg-img" alt="">
    </div>
    <div class="login-page-section container fw-bold">
        <div class="back-home-button px-3">
            <a href="indexsite.html" class="btn btn-primary home-btn d-flex align-items-center justify-content-center">
                <span class="mx-2 login-home-text fw-bold text-white">Go To Home</span>
            </a>
        </div>
        <div class="row justify-content-center px-5">
            <div class="col-lg-4 col-md-6">
                <div class="card inner-login-card p-4 mt-5">
                    <h2 class="text-center mb-4">Login</h2>
                    <form>
                        <!-- Email / Mobile -->
                        <div class="mb-3">
                            <label for="loginInput" class="form-label">
                                Email- ID
                            </label>
                            <input type="text" class="form-control" id="loginInput" placeholder="Enter mail here" />
                        </div>
                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>
                            <input type="password" class="form-control" id="password"
                                placeholder="Enter password here" />
                        </div>
                        <!-- Remember + Forgot -->
                        <div class="d-flex justify-content-between mb-3">
                            <div>
                                <input type="checkbox" class="form-check-input" id="remember" />
                                <label for="remember" class="form-check-label">
                                    Remember me
                                </label>
                            </div>

                            <a href="#" class="forgot-pass-link text-dark">Forgot password?</a>
                        </div>

                        <!-- Login -->
                        <button type="submit" class="btn btn-primary w-100 login-btn fw-bold">
                            Login
                        </button>

                        <!-- Divider -->
                        <div class="d-flex align-items-center my-3">
                            <hr class="flex-grow-1" />
                            <span class="mx-2 text-muted">OR</span>
                            <hr class="flex-grow-1" />
                        </div>

                        <!-- Google -->
                        <button type="button" class="btn w-100 google-btn fw-bold">
                            Continue with Google
                        </button>

                        <!-- Register -->
                        <p class="text-center mt-4 mb-0">
                            Don't have an account?
                            <a href="#" class="register-link">Register Here</a>
                        </p>

                    </form>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
